```yaml
name: CI/CD - Build, Test, Publish, Deploy

# Triggers on every change to main and on pull requests.
on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      target_slot:
        description: "Slot to cut traffic over to on manual deploy (blue|green)"
        required: false
        default: "green"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dam405-wine-predict-api


# ============================================================================
# 1) LINT + UNIT TEST
# ============================================================================
# Guarantees:
# - Python code is syntactically clean
# - API validation and business logic work
# - Model can be trained reproducibly
# ============================================================================

jobs:

  lint-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app/ model/ tests/ --max-line-length=120 --extend-ignore=E203

      - name: Train model
        run: python model/train.py

      - name: Run unit/API tests
        run: pytest tests/test_api.py -v

      - name: Upload trained model artefact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            model/model.joblib
            model/metadata.json


  # ==========================================================================
  # 2) BUILD + CONTAINER TEST
  # ==========================================================================
  # Guarantees:
  # - Docker image builds successfully
  # - Container starts successfully
  # - Health endpoint works
  # - Prediction API works over real HTTP
  # ==========================================================================

  build-and-container-test:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artefact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: model/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d \
            --name wine-api-test \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install smoke-test dependencies
        run: pip install requests

      - name: Container smoke test
        run: |
          python tests/smoke_test.py --host http://localhost:8000

      - name: Check image size
        run: |
          docker image inspect \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Image size: {{.Size}} bytes'

      - name: Dump container logs
        if: always()
        run: docker logs wine-api-test

      - name: Tear down test container
        if: always()
        run: docker rm -f wine-api-test

      - name: Save image as build artifact
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar


  # ==========================================================================
  # 3) PUBLISH TO GITHUB CONTAINER REGISTRY
  # ==========================================================================
  # Runs only when code is pushed to main.
  # The image receives:
  # - Immutable Git commit SHA tag
  # - latest tag
  # ==========================================================================

  publish:
    needs: build-and-container-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model artefact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: model/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================================================
  # 4) BLUE-GREEN DEPLOYMENT
  # ==========================================================================
  # The deployment job is connected to the GitHub "production" environment.
  #
  # In a real deployment environment, the commands below would:
  # - Deploy the new image to the idle slot
  # - Verify that it is healthy
  # - Switch traffic to the new slot
  # ==========================================================================

  deploy-blue-green:
    needs: publish

    runs-on: ubuntu-latest

    environment: production

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target slot
        id: slot
        run: |
          echo "slot=${{ github.event.inputs.target_slot || 'green' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy new image into idle slot
        run: |
          echo "Deploying image:"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Target slot:"
          echo "${{ steps.slot.outputs.slot }}"

          echo "IMAGE_TAG=${{ github.sha }}" >> deploy.env

          # On a real deployment host:
          #
          # docker compose pull app-${{ steps.slot.outputs.slot }}
          # docker compose up -d app-${{ steps.slot.outputs.slot }}

      - name: Cut traffic over
        run: |
          echo "Switching traffic to:"
          echo "${{ steps.slot.outputs.slot }}"

          # On a real deployment host:
          #
          # ./deployment/switch_traffic.sh \
          #   ${{ steps.slot.outputs.slot }}

      - name: Post-deployment verification
        run: |
          echo "Running post-deployment verification..."

          # On a real production host:
          #
          # python tests/smoke_test.py \
          #   --host http://PRODUCTION-HOST:8080

          echo "Post-deployment verification placeholder completed."


      # If post-deployment verification fails, rollback can be performed using:
      #
      # ./deployment/rollback.sh <previous_slot>
```
