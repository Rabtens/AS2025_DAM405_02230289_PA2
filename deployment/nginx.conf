# deployment/nginx.conf
# Routes all traffic to whichever slot is currently "live". To perform a
# blue-green switch, change the `server` line below to point at the other
# slot and reload nginx (`docker compose exec proxy nginx -s reload`).
# This one-line edit + reload is the entire cutover — no container restart,
# no downtime window, and reverting it is the rollback.

upstream live_backend {
    server wine-api-blue:8000;   # <- currently live slot. Swap to wine-api-green:8000 to cut over.
}

server {
    listen 80;

    location / {
        proxy_pass http://live_backend;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    location /nginx-health {
        return 200 "proxy ok\n";
    }
}
